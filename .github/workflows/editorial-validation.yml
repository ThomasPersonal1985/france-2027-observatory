name: Editorial data validation
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-editorial-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate canonical election data
        run: python3 scripts/validate_election_data.py
      - name: Check generated editorial review queue
        run: python3 scripts/build_editorial_review_queue.py --check
      - name: Test editorial approval rules
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test public editorial gate
        run: node -r ./editorial-workflow.js ./tests/editorial-workflow.test.js
